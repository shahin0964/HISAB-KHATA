name: Build & Sign Release APK / AAB

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    name: Build & Sign Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Diagnostic: After Checkout
        run: |
          echo "=== DIAGNOSTICS: AFTER CHECKOUT ==="
          if [ -f "gradle/wrapper/gradle-wrapper.jar" ]; then
            echo "SHA-256:"
            sha256sum gradle/wrapper/gradle-wrapper.jar || true
            echo "File size:"
            stat --format="%s bytes" gradle/wrapper/gradle-wrapper.jar || true
            echo "File type:"
            file gradle/wrapper/gradle-wrapper.jar || true
            echo "First 4 bytes hex:"
            od -An -t x1 -N 4 gradle/wrapper/gradle-wrapper.jar || true
          else
            echo "ERROR: gradle/wrapper/gradle-wrapper.jar does not exist!"
          fi

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          wrapper-validation: false
          allow-wrapper-checksums: 'a5e75118d96b4eac2100876f6af6a5ca5029cd440f87736425350fb4cf308b42'
          cache-disabled: true

      - name: Diagnostic: After Setup-Gradle
        run: |
          echo "=== DIAGNOSTICS: AFTER SETUP-GRADLE ==="
          if [ -f "gradle/wrapper/gradle-wrapper.jar" ]; then
            echo "SHA-256:"
            sha256sum gradle/wrapper/gradle-wrapper.jar || true
            echo "File size:"
            stat --format="%s bytes" gradle/wrapper/gradle-wrapper.jar || true
            echo "File type:"
            file gradle/wrapper/gradle-wrapper.jar || true
            echo "First 4 bytes hex:"
            od -An -t x1 -N 4 gradle/wrapper/gradle-wrapper.jar || true
          else
            echo "ERROR: gradle/wrapper/gradle-wrapper.jar does not exist!"
          fi

      - name: Make Gradlew Executable
        run: chmod +x ./gradlew

      - name: Decode Keystore from Secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 || secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "ERROR: Neither KEYSTORE_BASE64 nor SIGNING_KEYSTORE_BASE64 secret was found in GitHub Secrets!"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | tr -d '\r\n ' | base64 --decode > /tmp/release.keystore
          echo "Keystore decoded successfully to /tmp/release.keystore"

      - name: Diagnostic: Immediately Before ./gradlew
        run: |
          echo "=== DIAGNOSTICS: IMMEDIATELY BEFORE GRADLEW ==="
          if [ -f "gradle/wrapper/gradle-wrapper.jar" ]; then
            echo "1. SHA-256:"
            sha256sum gradle/wrapper/gradle-wrapper.jar || true
            echo "2. File size:"
            stat --format="%s bytes" gradle/wrapper/gradle-wrapper.jar || true
            echo "3. File command/type:"
            file gradle/wrapper/gradle-wrapper.jar || true
            echo "4. ZIP/JAR validity:"
            unzip -t gradle/wrapper/gradle-wrapper.jar || true
            echo "5. First 4 bytes in hexadecimal:"
            od -An -t x1 -N 4 gradle/wrapper/gradle-wrapper.jar || true
          else
            echo "ERROR: gradle/wrapper/gradle-wrapper.jar does not exist!"
          fi
          echo "6. Java version:"
          java -version || true
          echo "7. Git status:"
          git status || true
          echo "8. Git rev-parse HEAD:"
          git rev-parse HEAD || true
          echo "9. Git ls-tree HEAD gradle/wrapper/gradle-wrapper.jar:"
          git ls-tree HEAD gradle/wrapper/gradle-wrapper.jar || true
          echo "10. Git check-attr -a -- gradle/wrapper/gradle-wrapper.jar:"
          git check-attr -a -- gradle/wrapper/gradle-wrapper.jar || true

      - name: Build & Sign Release APK and AAB
        env:
          KEYSTORE_FILE: /tmp/release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          ./gradlew assembleRelease bundleRelease \
            -Pandroid.injected.signing.store.file="$KEYSTORE_FILE" \
            -Pandroid.injected.signing.store.password="$KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$KEY_PASSWORD"

      - name: Verify Signed APK Certificate Fingerprints
        run: |
          APK_PATH=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          if [ -z "$APK_PATH" ] || [ ! -f "$APK_PATH" ]; then
            echo "ERROR: Release APK not found in app/build/outputs/apk/release"
            exit 1
          fi
          echo "=========================================="
          echo "Verifying APK Signing Certificate: $APK_PATH"
          echo "=========================================="
          
          # Find apksigner binary
          APKSIGNER=$(find $ANDROID_SDK_ROOT/build-tools -name apksigner | sort -V | tail -n 1)
          echo "Using apksigner at: $APKSIGNER"
          
          "$APKSIGNER" verify --print-certs "$APK_PATH"
          
          echo "=========================================="
          echo "Expected Fingerprints:"
          echo "SHA-1  : CC:23:E6:EE:86:05:38:0B:E6:F8:8A:42:CE:7B:00:4C:2B:D1:94:F1"
          echo "SHA-256: 60:D4:7C:11:D9:23:CC:D0:BC:86:A3:E4:CA:6B:56:45:53:B1:75:CF:EB:4D:E1:3A:71:D4:DF:82:1F:BF:87:CB"
          echo "=========================================="

      - name: Upload Signed Release APK
        uses: actions/upload-artifact@v4
        with:
          name: HisabKhata-Release-APK
          path: app/build/outputs/apk/release/*.apk
          retention-days: 30

      - name: Upload Signed Release AAB (App Bundle)
        uses: actions/upload-artifact@v4
        with:
          name: HisabKhata-Release-AAB
          path: app/build/outputs/bundle/release/*.aab
          retention-days: 30

      - name: Cleanup Keystore
        if: always()
        run: |
          rm -f /tmp/release.keystore
          echo "Cleaned up temporary keystore file."
